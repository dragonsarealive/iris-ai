name: publish-cli

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.28). Leave empty to auto-derive from tag or branch."
        required: false
      channel:
        description: "npm dist-tag"
        required: false
        default: "latest"
      dry_run:
        description: "Skip actual npm publish (build only)"
        type: boolean
        default: false

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPENCODE_VERSION: ${{ inputs.version || '' }}
  OPENCODE_CHANNEL: ${{ inputs.channel || 'latest' }}
  # Tag push, or manual run with version (upload to e.g. v1.2.27 while on dev)
  OPENCODE_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')) && '1' || '' }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build CLI platform binaries
        run: bun run build
        working-directory: packages/iris

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: packages/iris/dist/
          retention-days: 3

  publish-cli:
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/iris/dist

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Prepare wrapper package
        working-directory: packages/iris
        run: |
          mkdir -p dist/iris-code
          cp -r bin dist/iris-code/bin
          cp script/postinstall.mjs dist/iris-code/postinstall.mjs
          cp ../../LICENSE dist/iris-code/LICENSE

          BINARIES_JSON=$(node -e "
            const fs = require('fs');
            const glob = require('path');
            const bins = {};
            for (const d of fs.readdirSync('dist')) {
              const p = 'dist/' + d + '/package.json';
              if (d !== 'iris-code' && fs.existsSync(p)) {
                const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
                bins[pkg.name] = pkg.version;
              }
            }
            process.stdout.write(JSON.stringify(bins));
          ")
          VERSION=$(node -e "process.stdout.write(Object.values(JSON.parse(process.argv[1]))[0])" "$BINARIES_JSON")

          node -e "
            const bins = JSON.parse(process.argv[1]);
            const pkg = {
              name: 'iris-code',
              bin: {
                'iris-code': './bin/iris',
                iris: './bin/iris',
                opencode: './bin/opencode'
              },
              scripts: { postinstall: 'bun ./postinstall.mjs || node ./postinstall.mjs' },
              version: process.argv[2],
              license: 'MIT',
              optionalDependencies: bins
            };
            require('fs').writeFileSync('dist/iris-code/package.json', JSON.stringify(pkg, null, 2));
          " "$BINARIES_JSON" "$VERSION"

      - name: Upload release artifacts
        if: ${{ env.OPENCODE_RELEASE == '1' }}
        working-directory: packages/iris
        run: |
          for key in dist/iris-code-*/; do
            [ -d "$key" ] || continue
            name=$(basename "$key")
            if echo "$name" | grep -q linux; then
              tar -czf "dist/${name}.tar.gz" -C "${key}/bin" .
            else
              cd "${key}/bin" && zip -r "../../${name}.zip" . && cd -
            fi
          done
          TAG="${RELEASE_TAG}"
          gh release upload "$TAG" dist/*.zip dist/*.tar.gz --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Publish platform packages
        if: ${{ !inputs.dry_run }}
        working-directory: packages/iris
        run: |
          CHANNEL="${OPENCODE_CHANNEL:-latest}"
          FAILED=""
          npm_publish_retry() {
            local delay=120
            local attempt=1
            local max=8
            while [ "$attempt" -le "$max" ]; do
              if npm publish *.tgz --access public --tag "$CHANNEL"; then
                return 0
              fi
              if [ "$attempt" -eq "$max" ]; then
                return 1
              fi
              echo "npm publish failed (attempt $attempt/$max), waiting ${delay}s (often E429 rate limit)..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay + 45))
            done
          }
          for dir in dist/iris-code-*/; do
            [ -d "$dir" ] || continue
            PKG_NAME=$(basename "$dir")
            echo "Publishing ${PKG_NAME}..."
            chmod -R 755 "$dir"
            cd "$dir"
            NAME=$(node -p "require('./package.json').name")
            VER=$(node -p "require('./package.json').version")
            if npm view "${NAME}@${VER}" version 2>/dev/null | grep -qx "$VER"; then
              echo "$NAME@$VER already on npm, skipping"
              cd -
              continue
            fi
            bun pm pack
            if npm_publish_retry; then
              echo "✓ $NAME@$VER published"
            else
              echo "✗ $NAME@$VER FAILED"
              FAILED="$FAILED $NAME"
            fi
            sleep 180
            cd -
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Failed to publish:$FAILED"
            exit 1
          fi

      - name: Publish wrapper package
        if: ${{ !inputs.dry_run }}
        working-directory: packages/iris/dist/iris-code
        run: |
          CHANNEL="${OPENCODE_CHANNEL:-latest}"
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VER}" version 2>/dev/null | grep -qx "$VER"; then
            echo "$NAME@$VER already on npm, skipping"
          else
            bun pm pack
            delay=120
            attempt=1
            max=8
            while [ "$attempt" -le "$max" ]; do
              if npm publish *.tgz --access public --tag "$CHANNEL"; then
                break
              fi
              if [ "$attempt" -eq "$max" ]; then
                exit 1
              fi
              echo "npm publish failed (attempt $attempt/$max), waiting ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay + 45))
            done
          fi

  publish-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Build and publish @iris-ai/sdk
        if: ${{ !inputs.dry_run }}
        working-directory: packages/sdk/js
        run: bun run script/publish.ts

  publish-plugin:
    needs: publish-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Build and publish @iris-ai/plugin
        if: ${{ !inputs.dry_run }}
        working-directory: packages/plugin
        run: bun run script/publish.ts
